name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Rust 1.81 + wasm32 (wasmvm 1.4 on ME Hub rejects newer wasm features)
        run: |
          rustup toolchain install 1.81.0 --profile minimal --target wasm32-unknown-unknown --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/cosmwasm-check
            ~/.cargo/registry
            contracts/leash-id/target
          key: cargo-${{ hashFiles('contracts/leash-id/Cargo.lock') }}-check-1.5.8
      - name: cosmwasm-check 1.5.8
        run: command -v cosmwasm-check || cargo +1.81.0 install cosmwasm-check --version 1.5.8 --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - name: Contract unit tests (fake x/did behind the Stargate query)
        run: npm run test:contract
      - name: Clippy, warnings are errors
        run: cd contracts/leash-id && cargo +1.81.0 clippy --all-targets -- -D warnings
      - name: JS syntax
        run: for f in leash.mjs lib/*.mjs mcp/*.mjs scripts/*.mjs test/*.mjs web/*.mjs; do node --check "$f"; done
      - name: JS tests (amounts, error reading, MCP tool set, key isolation, CLI)
        run: npm run test:js
      - name: The browser bundle (docs/vendor/cosmjs.js) is rebuilt byte for byte from the lockfile
        run: |
          cp docs/vendor/cosmjs.js /tmp/committed-cosmjs.js
          npm run bundle:web
          cmp /tmp/committed-cosmjs.js docs/vendor/cosmjs.js && echo "bundle reproducible ✔"
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high
      - name: Reproducible build + cosmwasm-check with ME Hub capabilities
        run: |
          cp artifacts/checksums.txt /tmp/committed.txt
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leash_id.wasm
          path: artifacts/leash_id.wasm
      - name: Built wasm == committed artifacts/leash_id.wasm
        run: diff /tmp/committed.txt artifacts/checksums.txt && echo "reproducible ✔"
      - name: The pages point at the deployed contract
        run: |
          want=$(node -p 'require("./deployment.json").contract')
          for f in docs/index.html docs/owner.html; do
            grep -q "contract: \"$want\"" $f || { echo "$f does not use $want"; exit 1; }
          done
          grep -q "\[\"$want\", \"[^\"]*\", [0-9]*, true\]" docs/tx.html || { echo "docs/tx.html does not mark $want as current"; exit 1; }

  # The whole system on a real ME Hub node built from openmetaearth/me-hub, on every push: the canonical wasm,
  # the obey-everything attack run, the ME ID kill switch, the sub-account link, then the owner console in a
  # real browser. scripts/check-runs.mjs asserts each claim the README and the video make.
  devnet:
    needs: contract
    runs-on: ubuntu-latest
    env:
      ME_HUB_DIR: ${{ github.workspace }}/me-hub
      # the release ME Hub testnet upgraded to at height 5,523,300 (gov proposal 11), so the devnet runs what testnet runs
      ME_HUB_REF: v2.0.18.rc1
      LEASH_HOME: ${{ github.workspace }}/.leash-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openmetaearth/me-hub
          ref: a5b287db1a91ec125921883fbd75499b4afc7a5c # v2.0.18.rc1
          path: me-hub
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: me-hub/go.mod
          cache-dependency-path: me-hub/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: med
        with:
          path: me-hub/build
          key: med-${{ env.ME_HUB_REF }}
      - name: Build ME Hub (med)
        if: steps.med.outputs.cache-hit != 'true'
        run: cd me-hub && make build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: leash_id.wasm
          path: artifacts
      - name: Throwaway keys for this run
        run: |
          node leash.mjs keygen owner agent vendor rogue lowkyc shop merchant cfo agent0
          node devnet/keys.mjs
      - name: Devnet runs (obey-everything, kill switch, sub-account) from an empty node
        run: rm -f runs/devnet-* && SKIP_CLAUDE=1 bash scripts/devnet-runs.sh   # only this run's records get checked
      - name: The run records show what the README claims
        run: node scripts/check-runs.mjs
      - name: Owner console, end to end in Chrome
        run: |
          devnet/start.sh > /tmp/med.log 2>&1 &
          until curl -sf localhost:36657/status > /dev/null; do sleep 1; done; sleep 3
          node scripts/serve-docs.mjs > /tmp/docs.log 2>&1 &
          sleep 1
          CHROME=$(command -v google-chrome) node scripts/e2e-owner.mjs
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devnet-runs
          path: runs/devnet-*

  # Talks to the public testnet, so it is kept apart: an outage there shouldn't fail the build.
  testnet:
    needs: contract
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - name: The committed wasm is what runs on ME Hub testnet, and nobody can swap it
        run: node scripts/verify.mjs
      - name: Every testnet transaction the committed records link to says what the record says
        run: node scripts/check-chain.mjs
