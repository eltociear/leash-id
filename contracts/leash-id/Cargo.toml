[package]
name = "leash-id"
version = "0.3.0"
edition = "2021"
rust-version = "1.81"
description = "KYC-backed spending leashes for AI agents on ME Network (ME ID checked on-chain via the DID module)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
library = []

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true

[dependencies]
cosmwasm-std = { version = "=1.5.8", features = ["stargate"] }
cosmwasm-schema = "=1.5.8"
cw-storage-plus = "=1.2.0"
schemars = "0.8.16"
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
thiserror = "1.0.58"
